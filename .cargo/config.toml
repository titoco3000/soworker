# livekit's libwebrtc is built against Chromium's libc++, so on Linux the C++ glue must be compiled with clang.
# (Target-specific names, so a Windows build keeps MSVC.)
[env]
CXX_x86_64_unknown_linux_gnu = "clang++"
CC_x86_64_unknown_linux_gnu = "clang"

# libwebrtc's Windows prebuilt links the C runtime statically (/MT); everything else has to match.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
