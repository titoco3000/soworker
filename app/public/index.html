<!doctype html>
<meta charset="utf-8">
<title>SoWorker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #14161b; overflow: hidden; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; left: 10px; top: 8px; color: #aab; pointer-events: none; text-shadow: 0 1px 2px #000; white-space: pre; }
  #dbg { position: fixed; left: 10px; bottom: 8px; color: #8fb; font: 12px ui-monospace, monospace; pointer-events: none; text-shadow: 0 1px 2px #000; white-space: pre; }
  #bar { position: fixed; right: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; color: #cde; }
  #bar button { background: #26303f; color: #cde; border: 1px solid #3a4658; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #bar button.on { background: #2f6f4f; border-color: #4a9; }
  #bar button.off { background: #6a2f3a; border-color: #a56; }
  #tiles { position: fixed; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .tile { position: relative; width: 200px; background: #000; border-radius: 6px; overflow: hidden; border: 2px solid transparent; }
  .tile.speaking { border-color: #7fd6a8; }
  .tile video { width: 100%; display: block; }
  .tile span { position: absolute; left: 6px; bottom: 4px; color: #fff; text-shadow: 0 1px 2px #000; font-size: 12px; }
</style>
<canvas id="c"></canvas>
<div id="hud">connecting…</div>
<div id="dbg"></div>
<div id="tiles"></div>
<div id="media" hidden></div>
<div id="bar">
  <span id="callinfo"></span>
  <button id="snd" hidden title="Chrome blocked call audio: click to enable">enable sound</button>
  <button id="mic" title="microphone (M)">mic off</button>
  <button id="cam" title="camera (C)">cam off</button>
  <button id="away" title="availability for calls">available</button>
</div>
<script src="client.js"></script>
<script src="call.js"></script>
