[package]
name = "soworker"
version = "0.1.6"
edition = "2021"
description = "Native lightweight SoWork client (no browser, no Node)"

[features]
default = ["tui", "gui", "calls", "portal"]
# Terminal client (ratatui). Video shows inline where the terminal supports the kitty graphics protocol, else in a small window.
tui = ["dep:ratatui", "dep:unicode-width", "window"]
# Graphical client: software-rendered window with sidebar, map, chat and meeting dock (`soworker --gui`). With both
# clients built in, each has a button that hands over to the other.
gui = ["window", "render", "overlay", "dep:image"]
# A bare window that only shows video frames (the TUI's fallback for camera and screen share).
window = ["dep:winit", "dep:softbuffer"]
render = ["dep:tiny-skia", "dep:fontdue"]
# Global push-to-talk shortcut: the desktop portal on Linux, a keyboard hook on Windows.
portal = ["dep:zbus"]
# a small always-on-top "you are live" pill through the wlr layer-shell protocol (Wayland; nothing elsewhere)
overlay = ["render", "dep:smithay-client-toolkit", "dep:wayland-client"]
# Audio/video calls through the official LiveKit Rust SDK (needs clang++ and the libwebrtc prebuilt at build time).
calls = ["dep:livekit", "dep:tokio", "dep:futures-util", "dep:v4l", "dep:nokhwa", "dep:deep_filter", "dep:ndarray", "dep:cpal"]

[dependencies]
livekit = { version = "0.9.3", features = ["rustls-tls-native-roots", "glib-main-loop"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
# Noise cancellation (DeepFilterNet 3, model built in) for the microphone; vendored, see vendor/deep_filter/README.md
deep_filter = { path = "vendor/deep_filter", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.16", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
rmpv = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"], optional = true }
fontdue = { version = "0.9", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
ureq = { version = "2", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"], optional = true }
unicode-width = { version = "0.2", optional = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = { version = "0.14", optional = true }
zbus = { version = "5", optional = true }
smithay-client-toolkit = { version = "0.19", optional = true }
wayland-client = { version = "0.31", optional = true }

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"], optional = true }
# microphone capture (WASAPI) for the noise-cancelled path; on Linux `parec` / `pw-record` do it
cpal = { version = "0.18", optional = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# size-optimise everything except the per-pixel crates, which stay fast
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.fontdue]
opt-level = 3

# `cargo run` (debug) stays usable: dependencies (tiny-skia, fontdue: all the pixel work) are optimized
# even in debug builds, our own code gets light optimization but keeps debug assertions and symbols.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = "s"
